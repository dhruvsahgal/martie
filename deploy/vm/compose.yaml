name: martie-browser

services:
  browser:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 512mb
    security_opt:
      - seccomp=./seccomp_profile.json
    env_file:
      - path: ../../.local/vm.env
        format: raw
    environment:
      MARTIE_DATA_DIR: /data
      MARTIE_BROWSER_MODE: ${MARTIE_BROWSER_MODE:-headless}
      MARTIE_VIEWER_ORIGIN: http://localhost:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - profile:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  profile:
    name: martie-browser-profile
